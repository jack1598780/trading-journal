<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>交易日誌</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f5f7fb;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:980px;margin:auto;padding:18px}.card{background:#121a2f;border:1px solid #2b3755;border-radius:18px;padding:18px;margin:14px 0}h1{margin:0;font-size:2rem}h2{font-size:1.08rem;margin:0 0 14px}.muted{color:#9eabc5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{display:flex;flex-direction:column;gap:7px;color:#aeb9d0;font-size:.9rem}input,select,textarea{width:100%;background:#0e1629;border:1px solid #2b3755;border-radius:10px;color:#fff;padding:11px;font:inherit}textarea{min-height:90px}.row{display:flex;gap:10px;flex-wrap:wrap}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice label{background:#18233d;padding:13px;border-radius:10px;display:block}.choice input{width:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#18233d;border-radius:12px;padding:14px}.stat b{display:block;font-size:1.35rem;margin-top:5px}button{border:0;border-radius:11px;padding:12px 16px;background:#263555;color:#fff;font-weight:700}.primary{background:#648cff}.trade{background:#0f1729;border:1px solid #2b3755;border-radius:12px;padding:13px;margin:9px 0}.tradehead{display:flex;justify-content:space-between;gap:10px}.pill{padding:4px 8px;border-radius:99px;background:#263555;font-size:.8rem}.green{color:#7fe3b3}.red{color:#ff9a9a}.calc{color:#7fe3b3;font-weight:700}@media(max-width:700px){.grid,.stats{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid,.stats,.choice{grid-template-columns:1fr}.wrap{padding:12px}.card{padding:15px}input,select,textarea{font-size:16px}.row button{width:100%}}</style></head><body><div class="wrap"><header><p class="muted">REAL TRADE JOURNAL</p><h1>交易日誌</h1><p class="muted">以風險與 R 倍數為核心的實單紀錄。</p></header><section class="card stats"><div class="stat">交易筆數<b id="sCount">0</b></div><div class="stat">總盈虧 U<b id="sPnl">0</b></div><div class="stat">總 R<b id="sR">0R</b></div><div class="stat">勝率<b id="sWin">0%</b></div></section><section class="card"><h2>建立交易</h2><div class="grid"><label>幣種 / 標的<input id="symbol" placeholder="BTC"></label><label>進場時間<input id="entryTime" type="datetime-local"></label><label>進場價格<input id="entry" type="number" step="any"></label><label>停損價格<input id="sl" type="number" step="any"></label><label>本筆風險（U）<input id="risk" type="number" step="any" placeholder="5"></label><label>固定目標 R<input id="targetR" type="number" step="0.1" value="1.5"></label></div><h2 style="margin-top:16px">方向</h2><div class="choice"><label><input type="radio" name="side" value="多"> 做多</label><label><input type="radio" name="side" value="空"> 做空</label></div><div class="card" style="margin:14px 0 0;background:#0e1629"><div>系統計算 TP：<span id="tp" class="calc">—</span></div><div>預計獲利：<span id="expected" class="calc">—</span></div></div><label style="margin-top:14px">進場原因<textarea id="entryReason"></textarea></label><div class="row" style="margin-top:14px"><button class="primary" id="createBtn">建立交易</button><button id="exportBtn">匯出 JSON 備份</button></div></section><section class="card"><h2>交易紀錄</h2><div id="list" class="muted">尚無紀錄</div></section></div><script>const K='realTradeJournalV1',$=id=>document.getElementById(id);function data(){try{return JSON.parse(localStorage.getItem(K))||[]}catch{return[]}}function save(x){localStorage.setItem(K,JSON.stringify(x))}function side(){return document.querySelector('input[name=side]:checked')?.value||''}function calc(){let e=+$('entry').value,s=+$('sl').value,r=+$('risk').value,t=+$('targetR').value,d=side();if(!e||!s||!t||!d){$('tp').textContent='—';$('expected').textContent='—';return}let dist=Math.abs(e-s),tp=d==='多'?e+dist*t:e-dist*t;$('tp').textContent=tp.toFixed(6).replace(/0+$/,'').replace(/\.$/,'');$('expected').textContent=r?`${(r*t).toFixed(2)} U`:'—'}document.querySelectorAll('#entry,#sl,#risk,#targetR,input[name=side]').forEach(x=>x.addEventListener('input',calc));$('createBtn').onclick=()=>{let d=side(),e=+$('entry').value,s=+$('sl').value,r=+$('risk').value,t=+$('targetR').value;if(!$('symbol').value||!d||!e||!s||!r){alert('請填寫標的、方向、進場價、停損與本筆風險。');return}let dist=Math.abs(e-s),tp=d==='多'?e+dist*t:e-dist*t,a=data();a.unshift({id:Date.now(),symbol:$('symbol').value.trim().toUpperCase(),side:d,entryTime:$('entryTime').value,entry:e,sl:s,risk:r,targetR:t,tp,entryReason:$('entryReason').value,status:'open'});save(a);render();alert('交易已建立。')};function closeTrade(id){let a=data(),x=a.find(v=>v.id===id);if(!x)return;let pnl=prompt('請輸入本筆實際盈虧 U（虧損請輸入負數）：');if(pnl===null||pnl==='')return;let exit=prompt('請輸入出場價格：','');let reason=prompt('出場原因：','');x.pnl=Number(pnl);x.actualR=x.risk?x.pnl/x.risk:0;x.exit=exit;x.exitReason=reason;x.status='closed';x.exitTime=new Date().toISOString();save(a);render()}function render(){let a=data(),closed=a.filter(x=>x.status==='closed'),p=closed.reduce((s,x)=>s+(+x.pnl||0),0),rr=closed.reduce((s,x)=>s+(+x.actualR||0),0),w=closed.filter(x=>x.pnl>0).length;$('sCount').textContent=a.length;$('sPnl').textContent=p.toFixed(2);$('sR').textContent=rr.toFixed(2)+'R';$('sWin').textContent=closed.length?Math.round(w/closed.length*100)+'%':'0%';$('list').innerHTML=a.length?'': '尚無紀錄';a.forEach(x=>{let d=document.createElement('div');d.className='trade';d.innerHTML=`<div class="tradehead"><strong>${x.symbol}｜${x.side}</strong><span class="pill">${x.status==='open'?'持倉中':'已平倉'}</span></div><p>Entry ${x.entry}｜SL ${x.sl}｜TP ${x.tp.toFixed(6).replace(/0+$/,'').replace(/\.$/,'')}｜風險 ${x.risk}U</p>${x.status==='closed'?`<p class="${x.pnl>=0?'green':'red'}">${x.pnl>=0?'+':''}${x.pnl}U｜${x.actualR>=0?'+':''}${x.actualR.toFixed(2)}R</p>`:`<button onclick="closeTrade(${x.id})">平倉 / 完成交易</button>`}`;$('list').appendChild(d)})}$('exportBtn').onclick=()=>{let b=new Blob([JSON.stringify(data(),null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='trading-journal.json';a.click();URL.revokeObjectURL(u)};render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
